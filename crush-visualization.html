<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUSH Algorithm Visualization</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #f0f2f5;
      color: #222;
    }
    h1 { margin: 0 0 0.2rem; font-size: 1.4rem; }
    p.subtitle { margin: 0 0 1rem; color: #666; font-size: 0.9rem; }
    /* summary bar */
    .summary-bar {
      display: flex;
      gap: 2.5rem;
      margin-top: 0.75rem;
      padding: 0.65rem 1rem;
      background: #fff;
      border: 1px solid #dde;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .summary-bar .stat { display: flex; flex-direction: column; gap: 0.1rem; }
    .summary-bar .stat-label {
      color: #888; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .summary-bar .stat-value { font-size: 1.05rem; font-weight: 600; color: #222; }
    .summary-bar .stat-value.warn { color: #e67e22; }
    /* availability panel */
    .avail-panel {
      margin-top: 0.75rem;
      padding: 0.65rem 1rem;
      background: #fff;
      border: 1px solid #dde;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .avail-panel h3 {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
      font-weight: 600;
    }
    .avail-scenarios { display: flex; gap: 1.5rem; }
    .avail-scenario {
      display: flex; flex-direction: column; gap: 0.25rem; min-width: 150px;
    }
    .avail-scenario .sc-title {
      font-size: 0.78rem; color: #888;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .avail-scenario .sc-status {
      display: inline-block; padding: 0.1rem 0.45rem;
      border-radius: 3px; font-size: 0.78rem; font-weight: 600; width: fit-content;
    }
    .sc-status.ok          { background: #d4f5e2; color: #1a7a42; }
    .sc-status.degraded    { background: #fdecd2; color: #a05000; }
    .sc-status.unavailable { background: #fad7d7; color: #a01010; }
    .avail-scenario .sc-cap { font-size: 1.0rem; font-weight: 600; color: #222; }
    .avail-scenario .sc-cap.none { color: #bbb; }
    .avail-scenario .sc-note { font-size: 0.75rem; color: #999; }
    /* pool configuration panel */
    .pool-panel {
      margin-top: 0.75rem;
      padding: 0.65rem 1rem;
      background: #fff;
      border: 1px solid #dde;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .pool-panel h3 {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
      font-weight: 600;
    }
    .pool-controls { display: flex; gap: 2.5rem; align-items: center; flex-wrap: wrap; }
    .pool-control { display: flex; align-items: center; gap: 0.5rem; }
    .pool-control label { font-size: 0.82rem; color: #555; white-space: nowrap; }
    .pool-value { font-weight: 600; color: #222; min-width: 2.5rem; text-align: right; font-size: 0.88rem; }
    /* topology controls panel */
    .ctrl-panel {
      margin-top: 0.75rem;
      padding: 0.65rem 1rem;
      background: #fff;
      border: 1px solid #dde;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .ctrl-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .ctrl-header h3 {
      margin: 0;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
      font-weight: 600;
    }
    .ctrl-host { border-top: 1px solid #eef; padding: 0.4rem 0; }
    .ctrl-host-header {
      display: flex; align-items: center; gap: 0.5rem; justify-content: space-between;
    }
    .ctrl-host-name { font-weight: 600; color: #2980b9; min-width: 80px; }
    .ctrl-host-actions { display: flex; align-items: center; gap: 0.4rem; }
    .ctrl-osds {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      margin-top: 0.35rem; padding-left: 1rem;
    }
    .ctrl-no-osds { color: #bbb; font-size: 0.8rem; font-style: italic; }
    .ctrl-osd {
      display: flex; align-items: center; gap: 0.3rem;
      background: #f7f9fb; border: 1px solid #dde; border-radius: 4px;
      padding: 0.15rem 0.5rem;
    }
    .ctrl-osd-label { font-size: 0.82rem; color: #444; }
    .ctrl-btn {
      border: none; border-radius: 4px; padding: 0.25rem 0.6rem;
      cursor: pointer; font-size: 0.82rem; font-family: system-ui, sans-serif;
    }
    .ctrl-btn:disabled { opacity: 0.4; cursor: default; }
    .ctrl-btn-add { background: #27ae60; color: #fff; }
    .ctrl-btn-add:not(:disabled):hover { background: #219a52; }
    .ctrl-btn-remove { background: #e74c3c; color: #fff; }
    .ctrl-btn-remove:not(:disabled):hover { background: #c0392b; }
    .ctrl-btn-sm { padding: 0.1rem 0.4rem; font-size: 0.76rem; }
    .osd-size {
      font-size: 0.82rem; border: 1px solid #dde; border-radius: 4px;
      padding: 0.2rem 0.3rem; font-family: system-ui, sans-serif;
    }
    /* main two-column layout: SVG left, topology controls right */
    .main-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }
    .main-row crush-map { flex: 1 1 0; min-width: 0; }
    .main-row .ctrl-panel {
      flex: 1 1 0;
      min-width: 0;
      margin-top: 0;
      overflow-y: auto;
      max-height: 460px;
    }
  </style>
</head>
<body>
  <h1>Ceph CRUSH Algorithm</h1>
  <p class="subtitle">Increment 5 — Pool configuration</p>

  <!-- shared type definitions (JSDoc only, no executable code) -->
  <script src="types.js"></script>
  <!-- application event bus -->
  <script src="bus.js"></script>
  <!-- CRUSH engine (increment 2) -->
  <script src="crush.js"></script>
  <!-- capacity analysis -->
  <script src="capacity.js"></script>
  <!-- SVG cluster map component -->
  <script src="crush-map.js"></script>

  <div class="main-row">
    <crush-map id="map"></crush-map>
    <div id="controls" class="ctrl-panel"></div>
  </div>

  <div id="summary" class="summary-bar"></div>
  <div id="pool-config" class="pool-panel"></div>
  <div id="availability" class="avail-panel"></div>

  <script>
    // ── cluster map data structure ────────────────────────────────────────────
    // Each OSD has an id (integer) and a size in TB (used as weight).
    // hid: stable numeric id used by the CRUSH hash (must not be reused).
    // out: true = temporarily excluded from placement.
    //
    // pool: pool configuration fed to the CRUSH engine.
    const clusterMap = {
      name: 'cluster',
      hosts: [
        {
          id: 'host-1', hid: 0, name: 'host-1', out: false,
          osds: [
            { id: 0, size: 4, out: false },
            { id: 1, size: 4, out: false },
          ]
        },
        {
          id: 'host-2', hid: 1, name: 'host-2', out: false,
          osds: [
            { id: 2, size: 8, out: false },
            { id: 3, size: 4, out: false },
            { id: 4, size: 8, out: false },
          ]
        },
        {
          id: 'host-3', hid: 2, name: 'host-3', out: false,
          osds: [
            { id: 5, size: 4, out: false },
            { id: 6, size: 8, out: false },
          ]
        },
      ]
    };

    const pool = { pgCount: 32, replicationFactor: 3, seed: 0 };

    // ── pool configuration controls ───────────────────────────────────────────
    const PG_COUNTS = [8, 16, 32, 64, 128, 256, 512, 1024];

    /**
     * Update the PG count label while the slider is being dragged (no re-render).
     * @param {string} idx
     * @returns {void}
     */
    function onPgSliderInput(idx) {
      const lbl = document.getElementById('pg-value');
      if (lbl) lbl.textContent = PG_COUNTS[parseInt(idx, 10)];
    }

    /**
     * Commit the PG count on slider release and re-render.
     * @param {string} idx
     * @returns {void}
     */
    function onPgSliderChange(idx) {
      pool.pgCount = PG_COUNTS[parseInt(idx, 10)];
      renderAll();
    }

    /**
     * Update the replication factor and re-render.
     * @param {string} val
     * @returns {void}
     */
    function onRfChange(val) {
      pool.replicationFactor = parseInt(val, 10);
      renderAll();
    }

    /**
     * Re-render the pool configuration panel from the current pool state.
     * @returns {void}
     */
    function renderPoolConfig() {
      const idx = PG_COUNTS.indexOf(pool.pgCount);
      const sliderIdx = idx >= 0 ? idx : 3;
      const rfOpts = [2, 3].map(n =>
        `<option value="${n}"${pool.replicationFactor === n ? ' selected' : ''}>${n}</option>`
      ).join('');
      document.getElementById('pool-config').innerHTML =
        `<h3>Pool configuration</h3>` +
        `<div class="pool-controls">` +
          `<div class="pool-control">` +
            `<label for="pg-slider">PG count</label>` +
            `<input id="pg-slider" type="range" min="0" max="7" step="1" value="${sliderIdx}" ` +
              `oninput="onPgSliderInput(this.value)" onchange="onPgSliderChange(this.value)">` +
            `<span class="pool-value" id="pg-value">${pool.pgCount}</span>` +
          `</div>` +
          `<div class="pool-control">` +
            `<label for="rf-select">Replication factor</label>` +
            `<select id="rf-select" class="osd-size" onchange="onRfChange(this.value)">${rfOpts}</select>` +
          `</div>` +
        `</div>`;
    }

    // ── stable-id counters (monotonically increasing; values never reused) ────
    let nextHid   = clusterMap.hosts.reduce((m, h) => Math.max(m, h.hid), -1) + 1;
    let nextOsdId = clusterMap.hosts
      .flatMap(h => h.osds)
      .reduce((m, o) => Math.max(m, o.id), -1) + 1;

    // ── topology mutation helpers ─────────────────────────────────────────────

    /**
     * Append a new empty host to the cluster map.
     * @returns {void}
     */
    function addHost() {
      const hid  = nextHid++;
      const name = `host-${hid + 1}`;
      clusterMap.hosts.push({ id: name, hid, name, out: false, osds: [] });
      renderAll();
    }

    /**
     * Remove a host and all its OSDs.
     * @param {string} hostId
     * @returns {void}
     */
    function removeHost(hostId) {
      clusterMap.hosts = clusterMap.hosts.filter(h => h.id !== hostId);
      renderAll();
    }

    /**
     * Add an OSD with the given size (TB) to a host.
     * @param {string} hostId
     * @param {number} size
     * @returns {void}
     */
    function addOsd(hostId, size) {
      const host = clusterMap.hosts.find(h => h.id === hostId);
      if (!host) return;
      host.osds.push({ id: nextOsdId++, size, out: false });
      renderAll();
    }

    /**
     * Remove an OSD from its host.
     * @param {string} hostId
     * @param {OsdId}  osdId
     * @returns {void}
     */
    function removeOsd(hostId, osdId) {
      const host = clusterMap.hosts.find(h => h.id === hostId);
      if (!host) return;
      host.osds = host.osds.filter(o => o.id !== osdId);
      renderAll();
    }

    /**
     * Read the size picker for a host and call addOsd.
     * @param {string} hostId
     * @returns {void}
     */
    function addOsdFromPicker(hostId) {
      const sel  = document.querySelector(`.osd-size[data-host="${hostId}"]`);
      const size = sel ? parseInt(sel.value, 10) : 4;
      addOsd(hostId, size);
    }

    // ── controls panel rendering ──────────────────────────────────────────────

    /**
     * Re-render the topology controls panel from the current clusterMap state.
     * @returns {void}
     */
    function renderControls() {
      const rf            = pool.replicationFactor;
      const canRemoveHost = clusterMap.hosts.length > rf;
      const SIZES         = [1, 2, 4, 8, 16];

      const hostRows = clusterMap.hosts.map(host => {
        const rmHostAttr = canRemoveHost ? '' : ' disabled';
        const sizeOpts   = SIZES.map(s =>
          `<option value="${s}"${s === 4 ? ' selected' : ''}>${s} TB</option>`
        ).join('');

        const osdItems = host.osds.length === 0
          ? `<span class="ctrl-no-osds">No OSDs — add one above</span>`
          : host.osds.map(osd => {
              const rmOsdAttr = host.osds.length > 1 ? '' : ' disabled';
              return `<span class="ctrl-osd">` +
                `<span class="ctrl-osd-label">osd.${osd.id}\u202f(${osd.size}\u202fTB)</span>` +
                `<button class="ctrl-btn ctrl-btn-remove ctrl-btn-sm"${rmOsdAttr} ` +
                  `onclick="removeOsd('${host.id}',${osd.id})">Remove</button>` +
                `</span>`;
            }).join('');

        return `<div class="ctrl-host">` +
          `<div class="ctrl-host-header">` +
            `<span class="ctrl-host-name">${host.name}</span>` +
            `<span class="ctrl-host-actions">` +
              `<select class="osd-size" data-host="${host.id}">${sizeOpts}</select>` +
              `<button class="ctrl-btn ctrl-btn-add" onclick="addOsdFromPicker('${host.id}')">+ Add OSD</button>` +
              `<button class="ctrl-btn ctrl-btn-remove"${rmHostAttr} onclick="removeHost('${host.id}')">Remove host</button>` +
            `</span>` +
          `</div>` +
          `<div class="ctrl-osds">${osdItems}</div>` +
          `</div>`;
      }).join('');

      document.getElementById('controls').innerHTML =
        `<div class="ctrl-header">` +
          `<h3>Topology controls</h3>` +
          `<button class="ctrl-btn ctrl-btn-add" onclick="addHost()">+ Add host</button>` +
        `</div>` +
        hostRows;
    }

    // ── colour helpers ────────────────────────────────────────────────────────
    // Maximum relative deviation across all OSDs with a non-zero ideal.
    // Used by the summary bar; SVG colouring is owned by crush-map.js.
    function imbalanceMetric(counts, ideals) {
      let maxDev = 0;
      for (const [id, ideal] of ideals) {
        if (ideal <= 0) continue;
        const actual = counts.get(id) ?? 0;
        const dev = Math.abs(actual - ideal) / ideal;
        if (dev > maxDev) maxDev = dev;
      }
      return maxDev;
    }

    // ── layout constants ──────────────────────────────────────────────────────
    // (owned by crush-map.js as CrushMap static fields)

    // ── render ────────────────────────────────────────────────────────────────
    function renderAll() {
      const mapping = CRUSH.computeMapping(clusterMap, pool);
      const counts  = CRUSH.pgCountsPerOsd(clusterMap, mapping);
      const ideals  = CRUSH.idealPgsPerOsd(clusterMap, pool);

      // Notify all subscribers (crush-map, future panels) of the new state.
      CrushBus.emit('state-changed', { clusterMap, pool, counts, ideals });

      // cluster-wide summary bar
      const imb    = imbalanceMetric(counts, ideals);
      const imbPct = (imb * 100).toFixed(1);
      document.getElementById('summary').innerHTML =
        `<div class="stat"><span class="stat-label">PGs</span>` +
          `<span class="stat-value">${pool.pgCount}</span></div>` +
        `<div class="stat"><span class="stat-label">Replication factor</span>` +
          `<span class="stat-value">${pool.replicationFactor}</span></div>` +
        `<div class="stat"><span class="stat-label">Total PG-slots</span>` +
          `<span class="stat-value">${pool.pgCount * pool.replicationFactor}</span></div>` +
        `<div class="stat"><span class="stat-label">Max imbalance</span>` +
          `<span class="stat-value${imb > 0.20 ? ' warn' : ''}">${imbPct}%</span></div>`;

      // worst-case capacity panel
      const scenarios = CAPACITY.worstCaseCapacity(clusterMap, pool.replicationFactor);
      const scHTML = scenarios.map(({ failures, hostsRemaining, status, usableTB }) => {
        const title  = failures === 0
          ? 'No failures'
          : `${failures} host${failures > 1 ? 's' : ''} lost (worst case)`;
        const capStr = usableTB !== null ? `${usableTB.toFixed(1)} TB usable` : '—';
        const capCls = usableTB !== null ? 'sc-cap' : 'sc-cap none';
        const label  = status === 'ok' ? 'Healthy'
                     : status === 'degraded' ? 'Degraded' : 'Unavailable';
        const note   = status === 'degraded'
          ? `${hostsRemaining} host${hostsRemaining !== 1 ? 's' : ''} remain &lt; RF=${pool.replicationFactor}; full replication lost`
          : status === 'unavailable' ? 'No hosts remaining' : '';
        return `<div class="avail-scenario">` +
          `<span class="sc-title">${title}</span>` +
          `<span class="sc-status ${status}">${label}</span>` +
          `<span class="${capCls}">${capStr}</span>` +
          (note ? `<span class="sc-note">${note}</span>` : '') +
          `</div>`;
      }).join('');
      document.getElementById('availability').innerHTML =
        `<h3>Worst-case usable capacity by host failures</h3>` +
        `<div class="avail-scenarios">${scHTML}</div>`;

      renderPoolConfig();
      renderControls();
    }

    renderAll();
  </script>
</body>
</html>
